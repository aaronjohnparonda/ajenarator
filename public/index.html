<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AJenarator: PCSO 6-number lotto analytics and smart pick generator.">
  <meta name="theme-color" content="#0B0F1A">
  <title>AJenarator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme-init.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#screen-root">Skip to content</a>

  <div class="app-shell">
    <nav class="app-nav" aria-label="Main">
      <div class="app-nav__brand">AJenarator</div>
      <a class="app-nav__item" href="#/home" data-route="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <span>Home</span>
      </a>
      <a class="app-nav__item" href="#/generate" data-route="generate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
        <span>Generate</span>
      </a>
      <a class="app-nav__item" href="#/stats" data-route="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/></svg>
        <span>Stats</span>
      </a>
      <a class="app-nav__item" href="#/results" data-route="results">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Results</span>
      </a>
      <a class="app-nav__item" href="#/me" data-route="me">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Me</span>
      </a>
    </nav>

    <div class="app-main">
      <header class="app-header">
        <div class="app-header__titles">
          <span class="app-header__greeting" id="greeting">Welcome</span>
          <span class="app-header__brand">AJenarator</span>
        </div>
        <div class="app-header__actions">
          <button class="icon-button" type="button" id="sound-toggle" aria-pressed="false" aria-label="Turn on sound effects">
            <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
            <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          </button>
          <button class="icon-button" type="button" id="theme-toggle" aria-label="Switch to light mode">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <a class="avatar-button" href="#/me" aria-label="Your account">A</a>
        </div>
      </header>

      <main id="screen-root" class="screen-root" tabindex="-1"></main>
    </div>
  </div>

  <div class="sr-only" aria-live="polite" id="announcer"></div>
  <div class="toast-region" aria-live="assertive" id="toast-region"></div>

  <!-- Screen templates: structure only. Data is filled in with textContent by the screen scripts. -->

  <template id="tpl-generate">
    <section class="screen screen--generate" aria-labelledby="generate-title">
      <h1 class="sr-only" id="generate-title">Generate picks</h1>

      <div class="game-chips" role="group" aria-label="Choose a game" data-ref="chips"></div>

      <article class="jackpot-card" aria-label="Last draw and next draw">
        <div class="jackpot-card__top">
          <span class="jackpot-card__label" data-ref="jackpotLabel"></span>
          <span class="jackpot-card__day"><span class="jackpot-card__dot" aria-hidden="true"></span><span data-ref="drawDay"></span></span>
        </div>
        <div class="jackpot-card__balls" data-ref="lastBalls" aria-label="Last winning numbers"></div>
        <span class="jackpot-card__amount" data-ref="jackpotAmount"></span>
        <span class="jackpot-card__meta" data-ref="lastDrawMeta"></span>
        <span class="jackpot-card__next" data-ref="drawMeta"></span>
      </article>

      <div class="picks-header">
        <h2 class="picks-header__title">Your picks</h2>
        <div class="stepper" role="group" aria-label="How many picks">
          <button class="stepper__button" type="button" data-ref="countDown" aria-label="Fewer picks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <span class="stepper__value" data-ref="countValue" aria-live="polite"></span>
          <button class="stepper__button" type="button" data-ref="countUp" aria-label="More picks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <p class="picks-coverage" data-ref="coverage"></p>

      <div class="picks-list" data-ref="picks"></div>

      <button class="primary-button" type="button" data-ref="generateButton">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
        <span data-ref="generateLabel">Generate picks</span>
      </button>
    </section>
  </template>

  <template id="tpl-pick-card">
    <article class="pick-card">
      <div class="pick-card__balls" data-ref="balls"></div>
      <div class="pick-card__badges" data-ref="badges"></div>
    </article>
  </template>

  <template id="tpl-empty-picks">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
      <p class="empty-state__title">Ready when you are</p>
      <p class="empty-state__text">Choose a game and how many picks, then tap Generate picks.</p>
    </div>
  </template>

  <template id="tpl-skeleton">
    <div class="skeleton-stack" aria-hidden="true">
      <div class="skeleton skeleton--card"></div>
      <div class="skeleton skeleton--card"></div>
      <div class="skeleton skeleton--card"></div>
    </div>
  </template>

  <template id="tpl-home">
    <section class="screen screen--home" aria-labelledby="home-title">
      <div class="section-heading">
        <h1 class="section-heading__title" id="home-title">Today’s draws</h1>
        <p class="section-heading__caption" data-ref="today"></p>
      </div>
      <div class="status-list" data-ref="list"></div>
      <p class="fine-print">Results are checked automatically on draw nights from about 10 PM. Tap a game to generate picks for it.</p>
    </section>
  </template>

  <template id="tpl-status-card">
    <a class="status-card" href="#/generate">
      <div class="status-card__top">
        <div class="status-card__titles">
          <span class="status-card__name" data-ref="name"></span>
          <span class="status-card__schedule" data-ref="schedule"></span>
        </div>
        <span class="status-pill" data-ref="pill"><span class="status-pill__dot" aria-hidden="true"></span><span data-ref="pillLabel"></span></span>
      </div>
      <div class="status-card__balls" data-ref="balls"></div>
      <div class="status-card__meta">
        <span data-ref="lastMeta"></span>
        <span class="status-card__jackpot" data-ref="jackpot"></span>
      </div>
      <span class="status-card__detail" data-ref="detail"></span>
    </a>
  </template>

  <template id="tpl-stats">
    <section class="screen screen--stats" aria-labelledby="stats-title">
      <h1 class="sr-only" id="stats-title">Statistics</h1>
      <div class="game-chips" role="group" aria-label="Choose a game" data-ref="chips"></div>
      <div class="stats-body" data-ref="body"></div>
    </section>
  </template>

  <template id="tpl-stats-content">
    <div class="stats-content">
      <div class="metric-row">
        <div class="metric-card"><span class="metric-card__label">Draws saved</span><span class="metric-card__value" data-ref="totalDraws"></span><span class="metric-card__hint" data-ref="since"></span></div>
        <div class="metric-card"><span class="metric-card__label">Past 3 years</span><span class="metric-card__value" data-ref="windowDraws"></span><span class="metric-card__hint">draws analyzed</span></div>
        <div class="metric-card"><span class="metric-card__label">Average sum</span><span class="metric-card__value" data-ref="averageSum"></span><span class="metric-card__hint" data-ref="sumRange"></span></div>
      </div>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Hot and cold</h2>
          <p class="panel__caption" data-ref="hotColdCaption"></p>
        </div>
        <div class="hot-cold">
          <span class="hot-cold__label">Hot</span>
          <div class="hot-cold__balls" data-ref="hot"></div>
          <span class="hot-cold__label">Cold</span>
          <div class="hot-cold__balls" data-ref="cold"></div>
        </div>
      </article>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">How often each number was drawn</h2>
          <p class="panel__caption" data-ref="heatCaption"></p>
        </div>
        <div class="heatmap" data-ref="heatmap"></div>
        <div class="heat-legend" aria-hidden="true"><span>Less</span><span class="heat-legend__bar"></span><span>More</span></div>
      </article>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Longest absent</h2>
          <p class="panel__caption">Draws since each number last appeared, across the full history</p>
        </div>
        <div class="gap-list" data-ref="gaps"></div>
      </article>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Patterns in winning numbers</h2>
          <p class="panel__caption" data-ref="patternCaption"></p>
        </div>
        <h3 class="panel__subtitle">Odd and even</h3>
        <div class="bar-list" data-ref="oddEven"></div>
        <h3 class="panel__subtitle">Low and high</h3>
        <div class="bar-list" data-ref="lowHigh"></div>
        <p class="panel__note" data-ref="pairNote"></p>
      </article>

      <p class="notice">These figures describe past draws only. PCSO draws behave randomly, so a hot or long-absent number is no more likely to come up next.</p>
    </div>
  </template>

  <template id="tpl-bar-row">
    <div class="bar-row">
      <span class="bar-row__label" data-ref="label"></span>
      <span class="bar-row__track"><span class="bar-row__fill" data-ref="fill"></span></span>
      <span class="bar-row__value" data-ref="value"></span>
    </div>
  </template>

  <template id="tpl-results">
    <section class="screen screen--results" aria-labelledby="results-title">
      <h1 class="sr-only" id="results-title">Results</h1>
      <div class="game-chips" role="group" aria-label="Choose a game" data-ref="chips"></div>
      <form class="date-filter" data-ref="form">
        <label class="date-filter__label" for="results-date">Show draws up to</label>
        <div class="date-filter__controls">
          <input class="date-filter__input" type="date" id="results-date" data-ref="date" min="2016-01-01">
          <button class="secondary-button date-filter__clear" type="button" data-ref="clear">Latest</button>
        </div>
      </form>
      <p class="results-summary" data-ref="summary" aria-live="polite"></p>
      <div class="draw-list" data-ref="list"></div>
      <button class="secondary-button load-more" type="button" data-ref="more">Load more</button>
    </section>
  </template>

  <template id="tpl-draw-row">
    <article class="draw-row">
      <div class="draw-row__top">
        <span class="draw-row__date" data-ref="date"></span>
        <span class="draw-row__jackpot" data-ref="jackpot"></span>
      </div>
      <div class="draw-row__balls" data-ref="balls"></div>
      <div class="draw-row__meta">
        <span data-ref="winners"></span>
        <span data-ref="order"></span>
      </div>
    </article>
  </template>

  <template id="tpl-coming-soon">
    <section class="screen screen--placeholder">
      <div class="empty-state empty-state--large">
        <p class="empty-state__title" data-ref="title"></p>
        <p class="empty-state__text" data-ref="text"></p>
        <a class="secondary-button" href="#/generate">Go to Generate</a>
      </div>
    </section>
  </template>
</body>
</html>
