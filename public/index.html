<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AJenarator: PCSO 6-number lotto analytics and smart pick generator.">
  <meta name="theme-color" content="#0B0F1A">
  <title>AJenarator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/theme-init.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#screen-root">Skip to content</a>

  <div class="app-shell">
    <nav class="app-nav" aria-label="Main">
      <div class="app-nav__brand">AJenarator</div>
      <a class="app-nav__item" href="#/home" data-route="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <span>Home</span>
      </a>
      <a class="app-nav__item" href="#/generate" data-route="generate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
        <span>Generate</span>
      </a>
      <a class="app-nav__item" href="#/stats" data-route="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/></svg>
        <span>Stats</span>
      </a>
      <a class="app-nav__item" href="#/results" data-route="results">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Results</span>
      </a>
      <a class="app-nav__item" href="#/me" data-route="me">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Me</span>
      </a>
    </nav>

    <div class="app-main">
      <header class="app-header">
        <div class="app-header__titles">
          <span class="app-header__greeting" id="greeting">Welcome</span>
          <span class="app-header__brand">AJenarator</span>
        </div>
        <div class="app-header__actions">
          <button class="icon-button" type="button" id="sound-toggle" aria-pressed="false" aria-label="Turn on sound effects">
            <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
            <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          </button>
          <button class="icon-button" type="button" id="theme-toggle" aria-label="Switch to light mode">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <a class="avatar-button" href="#/me" id="avatar-button" aria-label="Your account">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          </a>
        </div>
      </header>

      <main id="screen-root" class="screen-root" tabindex="-1"></main>
    </div>
  </div>

  <div class="sr-only" aria-live="polite" id="announcer"></div>
  <div class="toast-region" aria-live="assertive" id="toast-region"></div>

  <!-- Screen templates: structure only. Data is filled in with textContent by the screen scripts. -->

  <template id="tpl-generate">
    <section class="screen screen--generate" aria-labelledby="generate-title">
      <h1 class="sr-only" id="generate-title">Generate picks</h1>

      <div class="game-chips" role="group" aria-label="Choose a game" data-ref="chips"></div>

      <article class="jackpot-card" aria-label="Last draw and next draw">
        <div class="jackpot-card__top">
          <span class="jackpot-card__label" data-ref="jackpotLabel"></span>
          <span class="jackpot-card__day"><span class="jackpot-card__dot" aria-hidden="true"></span><span data-ref="drawDay"></span></span>
        </div>
        <div class="jackpot-card__balls" data-ref="lastBalls" aria-label="Last winning numbers"></div>
        <span class="jackpot-card__amount" data-ref="jackpotAmount"></span>
        <span class="jackpot-card__meta" data-ref="lastDrawMeta"></span>
        <span class="jackpot-card__next" data-ref="drawMeta"></span>
      </article>

      <div class="picks-header">
        <h2 class="picks-header__title">Your picks</h2>
        <div class="stepper" role="group" aria-label="How many picks">
          <button class="stepper__button" type="button" data-ref="countDown" aria-label="Fewer picks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <span class="stepper__value" data-ref="countValue" aria-live="polite"></span>
          <button class="stepper__button" type="button" data-ref="countUp" aria-label="More picks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <button class="filters-button" type="button" data-ref="filtersButton" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span class="filters-button__label" data-ref="filtersLabel">Default filters</span>
        <svg class="filters-button__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <p class="picks-coverage" data-ref="coverage"></p>

      <div class="picks-list" data-ref="picks"></div>

      <button class="primary-button" type="button" data-ref="generateButton">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
        <span data-ref="generateLabel">Generate picks</span>
      </button>
    </section>
  </template>

  <template id="tpl-pick-card">
    <article class="pick-card">
      <div class="pick-card__balls" data-ref="balls"></div>
      <div class="pick-card__badges" data-ref="badges"></div>
      <div class="pick-card__actions" data-ref="actions" hidden></div>
    </article>
  </template>

  <template id="tpl-empty-picks">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
      <p class="empty-state__title">Ready when you are</p>
      <p class="empty-state__text">Choose a game and how many picks, then tap Generate picks.</p>
    </div>
  </template>

  <template id="tpl-skeleton">
    <div class="skeleton-stack" aria-hidden="true">
      <div class="skeleton skeleton--card"></div>
      <div class="skeleton skeleton--card"></div>
      <div class="skeleton skeleton--card"></div>
    </div>
  </template>

  <template id="tpl-home">
    <section class="screen screen--home" aria-labelledby="home-title">
      <div class="section-heading">
        <h1 class="section-heading__title" id="home-title">Today’s draws</h1>
        <p class="section-heading__caption" data-ref="today"></p>
      </div>
      <a class="night-banner" href="#/live" data-ref="nightBanner" hidden>
        <span class="night-banner__eyebrow">Draw Night</span>
        <span class="night-banner__title" data-ref="nightTitle"></span>
        <span class="night-banner__text" data-ref="nightText"></span>
      </a>
      <div class="status-list" data-ref="list"></div>
      <p class="fine-print">After each 9:00 PM draw, AJenarator checks PCSO for the official result every 2 minutes until 10:30 PM, then every 10 minutes. Tap a game to generate picks for it.</p>
    </section>
  </template>

  <template id="tpl-status-card">
    <a class="status-card" href="#/generate">
      <div class="status-card__top">
        <div class="status-card__titles">
          <span class="status-card__name" data-ref="name"></span>
          <span class="status-card__schedule" data-ref="schedule"></span>
        </div>
        <span class="status-pill" data-ref="pill"><span class="status-pill__dot" aria-hidden="true"></span><span data-ref="pillLabel"></span></span>
      </div>
      <div class="status-card__balls" data-ref="balls"></div>
      <div class="status-card__meta">
        <span data-ref="lastMeta"></span>
        <span class="status-card__jackpot" data-ref="jackpot"></span>
      </div>
      <span class="status-card__detail" data-ref="detail"></span>
    </a>
  </template>

  <template id="tpl-stats">
    <section class="screen screen--stats" aria-labelledby="stats-title">
      <h1 class="sr-only" id="stats-title">Statistics</h1>
      <div class="game-chips" role="group" aria-label="Choose a game" data-ref="chips"></div>
      <div class="stats-body" data-ref="body"></div>
    </section>
  </template>

  <template id="tpl-stats-content">
    <div class="stats-content">
      <div class="metric-row">
        <div class="metric-card"><span class="metric-card__label">Draws saved</span><span class="metric-card__value" data-ref="totalDraws"></span><span class="metric-card__hint" data-ref="since"></span></div>
        <div class="metric-card"><span class="metric-card__label">Past 3 years</span><span class="metric-card__value" data-ref="windowDraws"></span><span class="metric-card__hint">draws analyzed</span></div>
        <div class="metric-card"><span class="metric-card__label">Average sum</span><span class="metric-card__value" data-ref="averageSum"></span><span class="metric-card__hint" data-ref="sumRange"></span></div>
      </div>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Hot and cold</h2>
          <p class="panel__caption" data-ref="hotColdCaption"></p>
        </div>
        <div class="hot-cold">
          <span class="hot-cold__label">Hot</span>
          <div class="hot-cold__balls" data-ref="hot"></div>
          <span class="hot-cold__label">Cold</span>
          <div class="hot-cold__balls" data-ref="cold"></div>
        </div>
      </article>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">How often each number was drawn</h2>
          <p class="panel__caption" data-ref="heatCaption"></p>
        </div>
        <div class="heatmap" data-ref="heatmap"></div>
        <div class="heat-legend" aria-hidden="true"><span>Less</span><span class="heat-legend__bar"></span><span>More</span></div>
      </article>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Longest absent</h2>
          <p class="panel__caption">Draws since each number last appeared, across the full history</p>
        </div>
        <div class="gap-list" data-ref="gaps"></div>
      </article>

      <article class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Patterns in winning numbers</h2>
          <p class="panel__caption" data-ref="patternCaption"></p>
        </div>
        <h3 class="panel__subtitle">Odd and even</h3>
        <div class="bar-list" data-ref="oddEven"></div>
        <h3 class="panel__subtitle">Low and high</h3>
        <div class="bar-list" data-ref="lowHigh"></div>
        <p class="panel__note" data-ref="pairNote"></p>
      </article>

      <p class="notice">These figures describe past draws only. PCSO draws behave randomly, so a hot or long-absent number is no more likely to come up next.</p>
    </div>
  </template>

  <template id="tpl-bar-row">
    <div class="bar-row">
      <span class="bar-row__label" data-ref="label"></span>
      <span class="bar-row__track"><span class="bar-row__fill" data-ref="fill"></span></span>
      <span class="bar-row__value" data-ref="value"></span>
    </div>
  </template>

  <template id="tpl-results">
    <section class="screen screen--results" aria-labelledby="results-title">
      <h1 class="sr-only" id="results-title">Results</h1>
      <div class="game-chips" role="group" aria-label="Choose a game" data-ref="chips"></div>
      <form class="date-filter" data-ref="form">
        <label class="date-filter__label" for="results-date">Show draws up to</label>
        <div class="date-filter__controls">
          <input class="date-filter__input" type="date" id="results-date" data-ref="date" min="2016-01-01">
          <button class="secondary-button date-filter__clear" type="button" data-ref="clear">Latest</button>
        </div>
      </form>
      <p class="results-summary" data-ref="summary" aria-live="polite"></p>
      <div class="draw-list" data-ref="list"></div>
      <button class="secondary-button load-more" type="button" data-ref="more">Load more</button>
    </section>
  </template>

  <template id="tpl-draw-row">
    <article class="draw-row">
      <div class="draw-row__top">
        <span class="draw-row__date" data-ref="date"></span>
        <span class="draw-row__jackpot" data-ref="jackpot"></span>
      </div>
      <div class="draw-row__balls" data-ref="balls"></div>
      <div class="draw-row__meta">
        <span data-ref="winners"></span>
        <span data-ref="order"></span>
      </div>
    </article>
  </template>

  <template id="tpl-filter-sheet">
    <dialog class="sheet" aria-labelledby="filter-title">
      <form class="sheet__inner" data-ref="form" novalidate>
        <header class="sheet__header">
          <div class="sheet__titles">
            <h2 class="sheet__title" id="filter-title">Filters</h2>
            <span class="sheet__subtitle" data-ref="gameName"></span>
          </div>
          <button class="icon-button" type="button" data-ref="close" aria-label="Close filters">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>

        <div class="sheet__body">
          <p class="sheet__intro">Picks must pass every rule that is on. Rules shape your picks; they don’t change the odds of any ticket.</p>

          <fieldset class="filter-group">
            <legend class="filter-group__title">Balance</legend>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">No all odd or all even</span><span class="filter-row__hint">Removes picks like 1-3-5-7-9-11</span></span>
              <input class="switch" type="checkbox" data-rule="oddEvenBalance">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">No all low or all high</span><span class="filter-row__hint">Keeps numbers from both halves of the range</span></span>
              <input class="switch" type="checkbox" data-rule="lowHighBalance">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">At least 3 tens-groups</span><span class="filter-row__hint">Avoids picks crowded into one or two decades</span></span>
              <input class="switch" type="checkbox" data-rule="tensGroups">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">At most 3 in one tens-group</span><span class="filter-row__hint">Avoids picks like 30-33-35-38 (optional)</span></span>
              <input class="switch" type="checkbox" data-rule="crowdedDecade">
            </label>
          </fieldset>

          <fieldset class="filter-group">
            <legend class="filter-group__title">Patterns</legend>
            <div class="filter-row filter-row--stacked">
              <label class="filter-row__main">
                <span class="filter-row__text"><span class="filter-row__name">Limit consecutive numbers</span><span class="filter-row__hint" data-ref="consecutiveHint"></span></span>
                <input class="switch" type="checkbox" data-rule="consecutive">
              </label>
              <div class="segmented" role="radiogroup" aria-label="Consecutive rule strength" data-ref="consecutiveMode">
                <label class="segmented__option"><input type="radio" name="consecutive-mode" value="strict"><span>Strict</span></label>
                <label class="segmented__option"><input type="radio" name="consecutive-mode" value="relaxed"><span>Relaxed</span></label>
              </div>
            </div>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">At most 2 consecutive pairs</span><span class="filter-row__hint">Removes picks like 1-2, 33-34, 41-42</span></span>
              <input class="switch" type="checkbox" data-rule="consecutivePairs">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">No 4 multiples of 5, 6 or 7</span><span class="filter-row__hint">Removes picks like 5-15-30-40 or 7-14-28-35</span></span>
              <input class="switch" type="checkbox" data-rule="sameMultiple">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">No 4 numbers from the last draw</span><span class="filter-row__hint">Skips near-replays of the latest result</span></span>
              <input class="switch" type="checkbox" data-rule="lastDrawRepeat">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">No 4 evenly spaced</span><span class="filter-row__hint">Removes patterns like 5-10-15-20</span></span>
              <input class="switch" type="checkbox" data-rule="evenlySpaced">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">Never repeat a past winner</span><span class="filter-row__hint">Skips every winning combination since 2016</span></span>
              <input class="switch" type="checkbox" data-rule="pastWinners">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">At most 2 sharing a last digit</span><span class="filter-row__hint">Avoids picks like 3, 13, 23</span></span>
              <input class="switch" type="checkbox" data-rule="lastDigit">
            </label>
            <label class="filter-row">
              <span class="filter-row__text"><span class="filter-row__name">Anti-birthday</span><span class="filter-row__hint">At least one number above 31, so a win is less likely to be shared</span></span>
              <input class="switch" type="checkbox" data-rule="antiBirthday">
            </label>
          </fieldset>

          <fieldset class="filter-group">
            <legend class="filter-group__title">Sum of the six numbers</legend>
            <div class="filter-row filter-row--stacked">
              <label class="filter-row__main">
                <span class="filter-row__text"><span class="filter-row__name">Keep the sum in range</span><span class="filter-row__hint" data-ref="sumHint"></span></span>
                <input class="switch" type="checkbox" data-rule="sumRange">
              </label>
              <div class="range-inputs" data-ref="sumInputs">
                <label class="range-inputs__field"><span>From</span><input type="number" inputmode="numeric" data-ref="sumMin"></label>
                <label class="range-inputs__field"><span>To</span><input type="number" inputmode="numeric" data-ref="sumMax"></label>
              </div>
            </div>
          </fieldset>

          <fieldset class="filter-group">
            <legend class="filter-group__title">Your numbers</legend>
            <p class="filter-group__hint">Tap once to always include (up to 5), twice to exclude, again to clear.</p>
            <div class="number-picker" data-ref="numberGrid"></div>
            <p class="number-picker__summary" data-ref="numberSummary" aria-live="polite"></p>
          </fieldset>

          <section class="backtest-box" aria-labelledby="backtest-title">
            <h3 class="backtest-box__title" id="backtest-title">Test against past draws</h3>
            <p class="backtest-box__text">See how many real winning combinations these settings would have kept.</p>
            <button class="secondary-button" type="button" data-ref="runBacktest">Run backtest</button>
            <div class="backtest-result" data-ref="backtestResult" aria-live="polite"></div>
          </section>

          <p class="form-error" data-ref="error" role="alert"></p>
        </div>

        <footer class="sheet__footer">
          <button class="secondary-button" type="button" data-ref="reset">Reset</button>
          <button class="primary-button sheet__apply" type="submit">Apply filters</button>
        </footer>
      </form>
    </dialog>
  </template>

  <template id="tpl-backtest-result">
    <div class="backtest-rings">
      <div class="ring" data-ref="winnersRing"><span class="ring__value" data-ref="winnersValue"></span></div>
      <div class="ring ring--muted" data-ref="allRing"><span class="ring__value" data-ref="allValue"></span></div>
      <span class="backtest-rings__label" data-ref="winnersLabel"></span>
      <span class="backtest-rings__label">of all possible combinations kept</span>
    </div>
    <p class="backtest-verdict" data-ref="verdict"></p>
    <ul class="backtest-removed" data-ref="removed"></ul>
  </template>

  <template id="tpl-account">
    <section class="screen screen--account" aria-labelledby="account-title">
      <h1 class="sr-only" id="account-title">Your account</h1>

      <div class="account-card" data-ref="signedOut">
        <div class="account-card__crest" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>
        </div>
        <h2 class="account-card__title">Owner sign-in</h2>
        <p class="account-card__text">Sign in to lock in one pick per game for every draw, then see how it did when the official results come out.</p>
        <div class="google-slot" data-ref="googleSlot"></div>
        <p class="account-card__status" data-ref="status" role="status"></p>
        <button class="secondary-button" type="button" data-ref="retry" hidden>Try again</button>
        <p class="account-card__fine">Only the owner's Google account can sign in. Generating, stats and results work for everyone.</p>
      </div>

      <div class="account-signed-in" data-ref="signedIn" hidden>
        <div class="profile-card">
          <div class="profile-card__avatar" data-ref="avatar"></div>
          <div class="profile-card__text">
            <p class="profile-card__name" data-ref="name"></p>
            <p class="profile-card__email" data-ref="email"></p>
          </div>
          <span class="owner-badge">Owner</span>
        </div>
        <div data-ref="myPicks"></div>
        <button class="secondary-button account-signed-in__signout" type="button" data-ref="signOut">Sign out</button>
      </div>
    </section>
  </template>

  <template id="tpl-my-picks">
    <div class="my-picks">
      <p class="my-picks__loading" data-ref="loading" role="status">Loading your picks…</p>
      <div class="my-picks__content" data-ref="content" hidden>
        <section class="panel">
          <div class="panel__header">
            <h2 class="panel__title">My Picks · next draws</h2>
            <p class="panel__caption">One pick per game for its next draw. Picks close at 8:00 PM and are final once locked in.</p>
          </div>
          <div class="upcoming-list" data-ref="upcoming"></div>
        </section>

        <section class="panel">
          <div class="panel__header">
            <h2 class="panel__title">Your record</h2>
          </div>
          <div class="metric-row">
            <div class="metric-card">
              <span class="metric-card__label">Picks</span>
              <span class="metric-card__value" data-ref="totalPicks">0</span>
              <span class="metric-card__hint" data-ref="settledHint"></span>
            </div>
            <div class="metric-card">
              <span class="metric-card__label">Best match</span>
              <span class="metric-card__value" data-ref="bestMatch">—</span>
              <span class="metric-card__hint">of 6 numbers</span>
            </div>
            <div class="metric-card">
              <span class="metric-card__label">3+ matched</span>
              <span class="metric-card__value" data-ref="threeOrMore">0</span>
              <span class="metric-card__hint">times</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel__header">
            <h2 class="panel__title">History</h2>
          </div>
          <p class="panel__note" data-ref="historyEmpty" hidden>No picks yet. Lock in your first one above.</p>
          <div class="pick-history" data-ref="history"></div>
          <button class="secondary-button load-more" type="button" data-ref="more" hidden>Load more</button>
        </section>
      </div>
    </div>
  </template>

  <template id="tpl-upcoming-row">
    <article class="upcoming-row">
      <div class="upcoming-row__top">
        <div class="upcoming-row__titles">
          <p class="upcoming-row__game" data-ref="game"></p>
          <p class="upcoming-row__when" data-ref="when"></p>
        </div>
        <span class="status-pill" data-ref="pill"></span>
      </div>
      <div class="upcoming-row__balls" data-ref="balls"></div>
      <div class="upcoming-row__actions" data-ref="actions">
        <button class="secondary-button" type="button" data-ref="choose">Choose numbers</button>
        <a class="secondary-button" href="#/generate" data-ref="generate">Use generator</a>
      </div>
    </article>
  </template>

  <template id="tpl-history-row">
    <article class="history-row">
      <div class="history-row__top">
        <span class="history-row__game" data-ref="game"></span>
        <span class="history-row__date" data-ref="date"></span>
      </div>
      <div class="history-row__balls" data-ref="balls"></div>
      <p class="history-row__status" data-ref="status"></p>
      <p class="history-row__winning" data-ref="winning"></p>
    </article>
  </template>

  <template id="tpl-pick-sheet">
    <dialog class="sheet pick-sheet" aria-labelledby="pick-sheet-title">
      <div class="sheet__inner">
        <header class="sheet__header">
          <div class="sheet__titles">
            <h2 class="sheet__title" id="pick-sheet-title">Lock in your pick</h2>
            <span class="sheet__subtitle" data-ref="subtitle"></span>
          </div>
          <button class="icon-button" type="button" data-ref="close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <div class="sheet__body">
          <div class="pick-sheet__step" data-ref="chooseStep">
            <p class="pick-sheet__count" data-ref="count" aria-live="polite"></p>
            <div class="number-picker" data-ref="grid" role="group" aria-label="Choose 6 numbers"></div>
          </div>
          <div class="pick-sheet__step pick-sheet__confirm" data-ref="confirmStep" hidden>
            <div class="pick-sheet__balls" data-ref="balls"></div>
            <p class="pick-sheet__draw" data-ref="drawText"></p>
            <p class="pick-sheet__final">Picks are final. Once locked in, this pick can't be changed or removed.</p>
            <p class="pick-sheet__lock" data-ref="lockText"></p>
          </div>
          <p class="form-error" data-ref="error" role="alert"></p>
        </div>
        <footer class="sheet__footer">
          <button class="secondary-button" type="button" data-ref="back">Cancel</button>
          <button class="primary-button sheet__apply" type="button" data-ref="primary">Lock in pick</button>
        </footer>
      </div>
    </dialog>
  </template>

  <template id="tpl-results-popup">
    <dialog class="result-dialog" aria-labelledby="result-dialog-title">
      <div class="result-dialog__inner">
        <div class="account-card__crest" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg>
        </div>
        <h2 class="result-dialog__title" id="result-dialog-title">Results are in</h2>
        <p class="result-dialog__text" data-ref="intro"></p>
        <div class="result-dialog__list" data-ref="list"></div>
        <button class="primary-button" type="button" data-ref="done">Nice</button>
      </div>
    </dialog>
  </template>
  <template id="tpl-draw-night">
    <section class="screen screen--night" aria-labelledby="night-title">
      <div class="section-heading">
        <h1 class="section-heading__title" id="night-title">Draw Night</h1>
        <p class="section-heading__caption" data-ref="date"></p>
      </div>
      <div class="night-stages" data-ref="stages"></div>
      <p class="fine-print">Numbers appear when PCSO posts the official result. AJenarator checks every 2 minutes after the draw, and this page updates by itself. The reveal shows the balls in the order PCSO drew them.</p>
    </section>
  </template>

  <template id="tpl-night-stage">
    <article class="night-stage">
      <div class="night-stage__top">
        <div class="night-stage__titles">
          <p class="night-stage__game" data-ref="game"></p>
          <p class="night-stage__status" data-ref="status"></p>
        </div>
        <span class="status-pill" data-ref="pill"><span class="status-pill__dot" aria-hidden="true"></span><span data-ref="pillLabel"></span></span>
      </div>
      <p class="night-stage__countdown" data-ref="countdown" hidden></p>
      <div class="night-stage__balls" data-ref="balls"></div>
      <p class="night-stage__summary" data-ref="summary" aria-live="polite"></p>
      <div class="night-stage__filter" data-ref="filterNote" role="status" hidden>
        <p class="night-stage__filter-title" data-ref="filterTitle"></p>
        <p class="night-stage__filter-detail" data-ref="filterDetail"></p>
      </div>
      <div class="night-stage__pick" data-ref="pickRow" hidden>
        <span class="night-stage__pick-label">Your pick</span>
        <div class="night-stage__pick-balls" data-ref="pickBalls"></div>
      </div>
      <a class="secondary-button night-stage__cta" href="#/me" data-ref="pickCta" hidden>Lock in a pick (closes 8:00 PM)</a>
      <button class="night-stage__replay" type="button" data-ref="replay" hidden>Replay reveal</button>
    </article>
  </template>
</body>
</html>
